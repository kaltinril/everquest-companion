<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The CURSOR OVERLAY window (owner request: "I lose my mouse on EQ screens"; called the cursor
      ring until 2026-11-26, and the file names keep that). A transparent, click-through,
      always-on-top window sized to the EverQuest window. What moves: a white circle (or the shape
      the player picked) that follows the pointer, with one child for the shapes that have an
      inner mark, and, only when the player turns them on, the two crosshair lines and the trail
      canvas.

      CSP: the same deny-by-default policy as index.html / overlay.html, minus everything this
      page cannot use. It loads no images, no fonts, and speaks to nothing — the only relaxation
      is `style-src 'unsafe-inline'` for the <style> block below.
        script-src 'self'   no inline/eval.
        connect-src 'self'  no fetch of its own; 'self' covers dev HMR's WebSocket.
        img-src / font-src / object-src / frame-src / child-src / base-uri / form-action  'none'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Cursor Overlay</title>
    <style>
      /* Transparent window: the OS composites the game underneath. Nothing on this page
         paints a background — only the ring itself is ever visible. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        /* Belt to the window-level setIgnoreMouseEvents braces: this page must never be
           a mouse target, whatever the window is doing. */
        pointer-events: none;
        cursor: none;
      }

      /*
        THE RING. Prerendered once and then only ever moved — see cursorRing.ts. Its size,
        stroke width and translation are the ONLY properties that change at runtime, and the
        translation is a compositor-only `translate3d`, so a cursor move costs no layout, no
        style recalc of anything else, and no repaint of the ring's own pixels.

        Readability on BOTH bright and dark scenes comes from three shadows drawn around one
        white stroke: a 1px dark contour outside it, a 1px dark contour inside it, and a wide,
        very soft dark glow. Over a snowfield the contours are what separate the ring from the
        background; over a dungeon the white stroke does that on its own and the glow just
        softens the edge.

        The border-color below is the DEFAULT (JOS-125), and the only frame it decides is the
        one before the window's config arrives — after that cursorRing.ts assigns the player's
        chosen colour through `ringStrokeColor()`. It is written here as the literal that
        function answers with for the default, and tests/cursorRingColor.test.mts reads this
        file to prove the two still agree: an upgrading player's ring must not change colour
        because a shared constant moved.
      */
      #ring {
        position: absolute;
        left: 0;
        top: 0;
        box-sizing: border-box;
        border-radius: 50%;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          inset 0 0 0 1px rgba(0, 0, 0, 0.6),
          0 0 14px 4px rgba(0, 0, 0, 0.28);
        /* Promote to its own compositor layer up front so the first move is as cheap as the
           ten-thousandth, and hint that only `transform` will ever change. */
        will-change: transform;
        transform: translate3d(-9999px, -9999px, 0);
        pointer-events: none;
      }

      /*
        THE INNER MARK of the `dot` and `target` shapes (shared/cursorRingShape.ts): a filled dot
        or a smaller ring, centred inside #ring. It is a CHILD of the ring, so the ring's transform
        moves it on the same compositor layer; cursorRing.ts styles it once per config and never
        on a move. Hidden for every other shape. The two contours give it the ring's readability
        on snow; the wide glow is left to the outer ring, which already darkens the middle.
      */
      #ring-inner {
        display: none;
        position: absolute;
        box-sizing: border-box;
        border-radius: 50%;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          inset 0 0 0 1px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }

      /*
        THE CROSSHAIR (owner, 2026-11-26): one full-height column and one full-width row through
        the pointer. Hidden until the player turns it on; cursorRing.ts then sets their weight and
        colour once per config, and a move changes only their transforms (translateX on the
        column, translateY on the row; shared/cursorCrosshair.ts). The overlay window is sized to
        the EverQuest window, so 100vh / 100vw span the game. The 1px dark contour is the ring's
        own, so a white line still reads on snow. Drawn under the ring.
      */
      .cross {
        display: none;
        position: absolute;
        left: 0;
        top: 0;
        background-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
        will-change: transform;
        pointer-events: none;
      }
      #cross-v {
        width: 2px;
        height: 100vh;
        transform: translate3d(-9999px, 0, 0);
      }
      #cross-h {
        width: 100vw;
        height: 2px;
        transform: translate3d(0, -9999px, 0);
      }

      /*
        THE TRAIL CANVAS (owner, 2026-11-26: "trail/particle affects"). Hidden, and never given a
        2D context, until the player picks a trail; cursorTrailCanvas.ts then sizes its backing
        store to the window times devicePixelRatio and runs an animation loop only while something
        is still fading. Drawn under the crosshair and the ring.
      */
      #trail {
        display: none;
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="trail"></canvas>
    <div id="cross-v" class="cross"></div>
    <div id="cross-h" class="cross"></div>
    <div id="ring"><div id="ring-inner"></div></div>
    <script type="module" src="/src/overlay/cursorRing.ts"></script>
  </body>
</html>
