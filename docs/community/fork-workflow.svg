<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1640 1194" width="1640" height="1194" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the kaltinril/everquest-companion community fork is run</title>
  <desc id="d">upstream/main fast-forwards into the fork's main. Every branch starts from main: fork-only branches, our feature branches, vetted copies of upstream pull requests, and test-neutering. BRANCHES.md lists them in merge order; merged in that order on top of main they make main_community, behind a gate run on each branch and again after the merge. A community-version tag on main_community builds a GitHub Release.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <style>
      .h { font-size: 19px; font-weight: 700; }
      .s { font-size: 14px; fill: #334155; }
      .b { font-size: 15px; fill: #0f172a; }
      .m { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #0f172a; }
      .w { fill: #ffffff; }
      .pill { fill: #ffffff; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="-40" width="1640" height="1194" fill="#ffffff"/>
  <text x="780" y="44" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">kaltinril/everquest-companion: how the community fork is run</text>
  <text x="780" y="72" text-anchor="middle" class="s" font-size="16">A fork of jmoyers/everquest-companion that keeps moving while the creator is away, and can hand every change back as its own pull request</text>

  <!-- upstream -->
  <rect x="30" y="96" width="420" height="132" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="126" class="h" fill="#0f172a">upstream = jmoyers/everquest-companion</text>
  <rect x="50" y="140" width="380" height="36" rx="8" class="pill" stroke="#94a3b8"/>
  <text x="66" y="164" class="m">upstream/main</text><text x="200" y="164" class="s">the creator's code</text>
  <rect x="50" y="184" width="380" height="36" rx="8" class="pill" stroke="#ea580c"/>
  <text x="66" y="208" class="m">upstream PR #N</text><text x="200" y="208" class="s" fill="#9a3412">untrusted until vetted</text>

  <!-- origin main -->
  <line x1="450" y1="158" x2="606" y2="158" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="528" y="146" text-anchor="middle" class="b" font-weight="700">fast-forward only</text>
  <rect x="610" y="96" width="420" height="132" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="126" class="h" fill="#0f172a">origin = kaltinril/everquest-companion</text>
  <rect x="630" y="140" width="380" height="36" rx="8" class="pill" stroke="#7c3aed"/>
  <text x="646" y="164" class="m">main</text><text x="700" y="164" class="s">mirrors upstream/main, never committed to</text>
  <text x="630" y="206" class="s">Every branch below starts from main.</text>

  <!-- house rules -->
  <rect x="1070" y="96" width="500" height="132" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1090" y="126" class="h" fill="#991b1b">House rules (docs/community/RULES.md)</text>
  <text x="1090" y="152" class="b">• Push to origin only, never to upstream.</text>
  <text x="1090" y="175" class="b">• A fix lands on the branch that owns the code.</text>
  <text x="1090" y="198" class="b">• A branch closes only when the owner says so.</text>
  <text x="1090" y="221" class="b">• Pushed after the owner has tested the build.</text>

  <!-- every branch starts from main -->
  <line x1="820" y1="228" x2="820" y2="252" stroke="#7c3aed" stroke-width="2"/>
  <line x1="300" y1="252" x2="820" y2="252" stroke="#7c3aed" stroke-width="2"/>
  <line x1="300" y1="252" x2="300" y2="268" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>

  <!-- 1-2: fork-only -->
  <rect x="30" y="272" width="540" height="166" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="302" class="h" fill="#15803d">Fork-only branches: never close, never a PR</text>
  <rect x="50" y="316" width="500" height="32" rx="7" class="pill" stroke="#16a34a"/><text x="64" y="338" class="m">main_community_rules</text><text x="262" y="338" class="s">these docs, the recipe, the rebuild script</text>
  <rect x="50" y="354" width="500" height="32" rx="7" class="pill" stroke="#16a34a"/><text x="64" y="376" class="m">local-data-refresh</text><text x="262" y="376" class="s">our re-scraped item and mob data</text>
  <rect x="50" y="392" width="500" height="32" rx="7" class="pill" stroke="#16a34a"/><text x="64" y="414" class="m">community_release_rules</text><text x="262" y="414" class="s">how a test build is published</text>

  <!-- 3: feature branches -->
  <rect x="30" y="454" width="540" height="236" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="484" class="h" fill="#1d4ed8">Our feature branches</text>
  <text x="50" y="506" class="s">One per feature or fix, each a pull request the creator can take alone</text>
  <rect x="50" y="518" width="250" height="32" rx="7" class="pill" stroke="#2563eb"/><text x="64" y="540" class="m">gear-tab-improvements</text>
  <rect x="310" y="518" width="240" height="32" rx="7" class="pill" stroke="#2563eb"/><text x="324" y="540" class="m">map-improvements</text>
  <rect x="50" y="558" width="250" height="32" rx="7" class="pill" stroke="#2563eb"/><text x="64" y="580" class="m">spell-upgrades</text>
  <rect x="310" y="558" width="240" height="32" rx="7" class="pill" stroke="#2563eb"/><text x="324" y="580" class="m">bazaar-tab</text>
  <rect x="50" y="598" width="500" height="32" rx="7" class="pill" stroke="#2563eb"/><text x="64" y="620" class="m">catch_all</text><text x="160" y="620" class="s">small fixes to the creator's code, one commit each</text>
  <text x="50" y="656" class="s">… about 25 in all, each with its purpose in BRANCHES.md.</text>
  <text x="50" y="678" class="s">Worked on in .claude/worktrees/&lt;branch&gt;, never on main_community.</text>

  <!-- 4: adopted PRs -->
  <rect x="30" y="706" width="540" height="176" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="50" y="736" class="h" fill="#c2410c">Adopted upstream pull requests</text>
  <text x="50" y="758" class="s">Whole diff read, gate run, a row in ADOPTIONS.md, before any merge</text>
  <rect x="50" y="770" width="290" height="32" rx="7" class="pill" stroke="#ea580c"/><text x="64" y="792" class="m">community/pr-63-bonus-exp</text>
  <rect x="50" y="810" width="370" height="32" rx="7" class="pill" stroke="#ea580c"/><text x="64" y="832" class="m">community/pr-47-hide-raid-targets</text>
  <text x="50" y="868" class="s">… 10 in all. A copy, so the build never depends on a PR that moves.</text>

  <!-- 5: test-neutering -->
  <rect x="30" y="898" width="540" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="50" y="928" class="h" fill="#15803d">Fork-only, always merged last</text>
  <rect x="50" y="942" width="500" height="32" rx="7" class="pill" stroke="#16a34a"/><text x="64" y="964" class="m">test-neutering</text><text x="210" y="964" class="s">TEST identity, version bumps, tester notes</text>

  <!-- left margin: our branches go up as PRs; upstream PRs come down vetted -->
  <path d="M30,580 L-6,580 L-6,158 L44,158" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ab)"/>
  <text x="-16" y="370" class="s" fill="#1d4ed8" transform="rotate(-90 -16 370)" text-anchor="middle">a PR to upstream when the creator returns</text>
  <rect x="-12" y="196" width="12" height="12" fill="#ffffff"/>
  <path d="M-6,190 C2,196 2,208 -6,214" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M50,202 L14,202 L14,794 L26,794" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ao)"/>
  <text x="4" y="690" class="s" fill="#c2410c" transform="rotate(-90 4 690)" text-anchor="middle">vet, then copy</text>

  <!-- recipe -->
  <rect x="640" y="272" width="380" height="718" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="302" class="h" fill="#6d28d9">The recipe: BRANCHES.md</text>
  <text x="660" y="324" class="s">One branch per line, merged top to bottom.</text>
  <line x1="676" y1="375" x2="676" y2="395" stroke="#94a3b8" stroke-width="2"/>
  <line x1="676" y1="425" x2="676" y2="557" stroke="#94a3b8" stroke-width="2"/>
  <line x1="676" y1="587" x2="676" y2="779" stroke="#94a3b8" stroke-width="2"/>
  <line x1="676" y1="809" x2="676" y2="929" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="676" cy="360" r="15" fill="#16a34a"/><text x="676" y="365" text-anchor="middle" class="w" font-weight="700">1</text>
  <text x="702" y="357" class="m">main_community_rules</text>
  <text x="702" y="376" class="s">first, so the rules are on every build</text>
  <circle cx="676" cy="410" r="15" fill="#16a34a"/><text x="676" y="415" text-anchor="middle" class="w" font-weight="700">2</text>
  <text x="702" y="407" class="m">local-data-refresh</text>
  <text x="702" y="426" class="m">community_release_rules</text>
  <circle cx="676" cy="572" r="15" fill="#2563eb"/><text x="676" y="577" text-anchor="middle" class="w" font-weight="700">3</text>
  <text x="702" y="569" class="b" font-weight="600">our feature branches</text>
  <text x="702" y="589" class="s">a base above what builds on it;</text>
  <text x="702" y="608" class="s">sidebar-groups after every tab</text>
  <text x="702" y="656" class="s">A new branch is not finished until</text>
  <text x="702" y="675" class="s">its recipe line and row exist, and its</text>
  <text x="702" y="694" class="s">asks are listed in requirements/;</text>
  <text x="702" y="713" class="s">no ask is dropped without the owner.</text>
  <circle cx="676" cy="794" r="15" fill="#ea580c"/><text x="676" y="799" text-anchor="middle" class="w" font-weight="700">4</text>
  <text x="702" y="791" class="m">community/pr-*</text>
  <text x="702" y="811" class="s">with deps-refresh and installer-size,</text>
  <text x="702" y="830" class="s">each built on the PR it sits beside</text>
  <circle cx="676" cy="944" r="15" fill="#16a34a"/><text x="676" y="949" text-anchor="middle" class="w" font-weight="700">5</text>
  <text x="702" y="941" class="m">test-neutering</text>
  <text x="702" y="961" class="s">always last, so the TEST identity wins</text>

  <line x1="570" y1="360" x2="636" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="570" y1="410" x2="636" y2="410" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="570" y1="572" x2="636" y2="572" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="570" y1="794" x2="636" y2="794" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="570" y1="944" x2="636" y2="944" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>

  <!-- gate -->
  <rect x="1070" y="272" width="500" height="160" rx="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="1090" y="302" class="h" fill="#a21caf">The gate, on Node 24</text>
  <text x="1090" y="326" class="m">npm run typecheck · npm run lint · npm test</text>
  <text x="1090" y="354" class="b">1. on the branch alone, then</text>
  <text x="1090" y="378" class="b">2. on main_community after the merge.</text>
  <text x="1090" y="406" class="s">Only the known reds listed in BRANCHES.md may fail;</text>
  <text x="1090" y="424" class="s">anything else is a regression and the merge does not stand.</text>
  <line x1="1320" y1="432" x2="1320" y2="466" stroke="#c026d3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- main_community -->
  <line x1="1020" y1="585" x2="1066" y2="585" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1070" y="470" width="500" height="230" rx="12" fill="#1e293b"/>
  <text x="1092" y="506" font-size="22" font-weight="800" class="w">main_community</text>
  <text x="1092" y="530" font-size="15" fill="#cbd5e1">the integration branch: what everyone runs</text>
  <text x="1092" y="564" font-size="15" class="w">• main plus every recipe branch, merged in order</text>
  <text x="1092" y="590" font-size="15" class="w">• merges only; conflict fixes are replayed by git rerere</text>
  <text x="1092" y="616" font-size="15" class="w">• rebuilt from scratch any time by</text>
  <text x="1110" y="638" font-size="14" font-family="Consolas, Menlo, monospace" fill="#a5b4fc">scripts/community/rebuild-main-community.sh</text>
  <text x="1092" y="672" font-size="15" class="w">• runs the dev app; every test build is cut from it</text>

  <!-- release -->
  <line x1="1320" y1="700" x2="1320" y2="776" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="1070" y="780" width="500" height="210" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="1090" y="810" class="h" fill="#0f172a">A release (RELEASING.md)</text>
  <rect x="1090" y="824" width="140" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1160" y="848" text-anchor="middle" class="m">community-</text><text x="1160" y="868" text-anchor="middle" class="m">&lt;version&gt; tag</text>
  <line x1="1230" y1="852" x2="1262" y2="852" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1266" y="824" width="140" height="56" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="1336" y="848" text-anchor="middle" class="s">GitHub Actions</text><text x="1336" y="868" text-anchor="middle" class="s">builds it</text>
  <line x1="1406" y1="852" x2="1438" y2="852" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1442" y="824" width="110" height="56" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="1497" y="848" text-anchor="middle" class="s">Release on</text><text x="1497" y="868" text-anchor="middle" class="s">the fork</text>
  <text x="1090" y="910" class="s">Pushing a branch never releases anything; only the owner's tag does.</text>
  <text x="1090" y="932" class="s">v* tags are never pushed: they start the creator's official build.</text>
  <text x="1090" y="954" class="s">The TEST build installs beside the official app and updates itself</text>
  <text x="1090" y="974" class="s">from this fork's Releases page only.</text>

  <!-- a fix's path -->
  <rect x="30" y="1012" width="1540" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="1042" class="h" fill="#0f172a">How one fix travels</text>
  <g font-size="15">
    <rect x="50" y="1058" width="232" height="66" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="166" y="1086" text-anchor="middle" class="b">Find the branch that</text><text x="166" y="1108" text-anchor="middle" class="b">owns the code, or catch_all</text>
    <line x1="282" y1="1091" x2="304" y2="1091" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="308" y="1058" width="232" height="66" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="424" y="1086" text-anchor="middle" class="b">Fix and test it in that</text><text x="424" y="1108" text-anchor="middle" class="b">branch's own worktree</text>
    <line x1="540" y1="1091" x2="562" y2="1091" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="566" y="1058" width="232" height="66" rx="8" fill="#ffffff" stroke="#c026d3"/>
    <text x="682" y="1086" text-anchor="middle" class="b">Gate on the branch</text><text x="682" y="1108" text-anchor="middle" class="b">alone</text>
    <line x1="798" y1="1091" x2="820" y2="1091" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="824" y="1058" width="232" height="66" rx="8" fill="#ffffff" stroke="#1e293b"/>
    <text x="940" y="1086" text-anchor="middle" class="b">Merge into main_community,</text><text x="940" y="1108" text-anchor="middle" class="b">gate again</text>
    <line x1="1056" y1="1091" x2="1078" y2="1091" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1082" y="1058" width="232" height="66" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="1198" y="1086" text-anchor="middle" class="b">The owner tests</text><text x="1198" y="1108" text-anchor="middle" class="b">the app</text>
    <line x1="1314" y1="1091" x2="1336" y2="1091" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1340" y="1058" width="212" height="66" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <text x="1446" y="1086" text-anchor="middle" class="b">Push the branch and</text><text x="1446" y="1108" text-anchor="middle" class="b">main_community to origin</text>
  </g>

  <!-- legend -->
  <g font-size="14" fill="#334155">
    <circle cx="44" cy="1168" r="8" fill="#16a34a"/><text x="58" y="1173">fork-only, never closing</text>
    <circle cx="260" cy="1168" r="8" fill="#2563eb"/><text x="274" y="1173">our feature branches (future upstream PRs)</text>
    <circle cx="600" cy="1168" r="8" fill="#ea580c"/><text x="614" y="1173">adopted upstream PRs</text>
    <line x1="800" y1="1168" x2="850" y2="1168" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="860" y="1173">merge flow</text>
    <line x1="960" y1="1168" x2="1010" y2="1168" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ab)"/><text x="1020" y="1173">to or from upstream: a PR later, or a PR adopted after vetting</text>
  </g>
</svg>
